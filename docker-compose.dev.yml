# Development Docker Compose Configuration
# Use with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend:
    # Override build for faster rebuilds
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - icp-agent-backend:latest
    
    # Mount source code for hot-reload
    volumes:
      - ./src:/app/src
      - ./api.py:/app/api.py
      - ./data:/app/data:ro
      # Exclude these from mount to avoid conflicts
      - /app/.venv
      - /app/__pycache__
    
    # Development environment variables
    environment:
      DEBUG_MODE: "true"
    
    # Override command for development mode with auto-reload
    command: >
      sh -c "uv sync &&
             uv run uvicorn api:app
             --host 0.0.0.0
             --port 8000
             --reload
             --log-level debug"
    
    # No restart in dev (easier to debug crashes)
    restart: "no"

  frontend:
    # Development build - don't use production optimizations
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: deps  # Only build deps stage
    
    # Mount source code for hot-reload
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    
    # Override command for development mode
    command: npm run dev
    
    # Development environment - use localhost backend for browser access
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    
    # No restart in dev
    restart: "no"

