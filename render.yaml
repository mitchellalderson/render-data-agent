databases:
  # PostgreSQL Database
  - name: icp-analysis-db
    databaseName: render_data
    plan: free
    region: oregon
    ipAllowList: []  # Allow connections from all Render services

services:
  # FastAPI Backend API
  - type: web
    name: icp-analysis-api
    runtime: docker
    plan: starter
    region: oregon
    
    # Use the backend Dockerfile
    dockerfilePath: ./Dockerfile
    
    # Run database migrations before starting the app
    preDeployCommand: "uv run python migrate.py"
    
    # Environment variables for the FastAPI backend
    envVars:
      # Database configuration (connects to the database above)
      - key: POSTGRES_HOST
        fromDatabase:
          name: icp-analysis-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: icp-analysis-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: icp-analysis-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: icp-analysis-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: icp-analysis-db
          property: password
      - key: DATABASE_URL
        fromDatabase:
          name: icp-analysis-db
          property: connectionString
      
      # LLM API Configuration
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4-turbo-preview
      
      # App Configuration
      - key: APP_TITLE
        value: ICP Analysis Dashboard
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"
      - key: DEBUG_MODE
        value: "false"
      - key: PORT
        value: "8000"
      # Frontend URL for CORS (set this manually in Render dashboard after frontend deploys)
      # (e.g., https://icp-analysis-frontend.onrender.com)
      - key: FRONTEND_URL
        sync: false
    
    # Health check endpoint (FastAPI health endpoint)
    healthCheckPath: /api/status
    
    # Auto-deploy from main branch
    autoDeploy: true

  # Next.js Frontend
  - type: web
    name: icp-analysis-frontend
    runtime: docker
    plan: starter
    region: oregon
    
    # Use the frontend Dockerfile
    dockerfilePath: ./Dockerfile.frontend
    
    # Environment variables for the Next.js frontend
    envVars:
      # Point to the backend API service
      # Set this manually in Render dashboard to the full backend URL
      # (e.g., https://icp-analysis-api.onrender.com)
      # This will be set automatically after first deployment
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
    
    # Health check endpoint (Next.js default)
    healthCheckPath: /
    
    # Auto-deploy from main branch
    autoDeploy: true

version: "1"

