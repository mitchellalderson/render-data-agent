[project]
name = "render-data-agent"
version = "0.1.0"
description = "ICP Analysis Dashboard - Compare user signups with customer data using LLM insights"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.50.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "plotly>=5.18.0",
    "altair>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.12.0",
    "ruff>=0.1.9",
]
